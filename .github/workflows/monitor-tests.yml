name: Local monitor synthetic tests
on:
  push:
    branches: [group-chat-monitor]
  pull_request:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r monitor/requirements.lock
      - run: python -B -m unittest discover -s monitor -p "test_*.py" -v
